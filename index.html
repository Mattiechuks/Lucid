    <meta charset="UTF-8" />

    <script>
      // Global error & unhandled rejection suppression for benign platform HMR and Firestore BloomFilter warnings
      (function() {
        function isBenign(str) {
          if (!str) return false;
          var s = String(str);
          return (
            s.indexOf('WebSocket closed without opened') !== -1 ||
            s.indexOf('failed to connect to websocket') !== -1 ||
            s.indexOf('BloomFilter') !== -1 ||
            s.indexOf('BloomFilterError') !== -1
          );
        }

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event.reason;
          var msg = (reason && (reason.message || reason.stack || String(reason))) || '';
          if (isBenign(msg)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener('error', function(event) {
          var msg = (event && (event.message || (event.error && (event.error.message || String(event.error))))) || '';
          if (isBenign(msg)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);

        // Filter console errors and warnings for these benign messages
        var origConsoleError = console.error;
        console.error = function() {
          for (var i = 0; i < arguments.length; i++) {
            if (isBenign(arguments[i])) {
              return;
            }
          }
          origConsoleError.apply(console, arguments);
        };

        var origConsoleWarn = console.warn;
        console.warn = function() {
          for (var i = 0; i < arguments.length; i++) {
            if (isBenign(arguments[i])) {
              return;
            }
          }
          origConsoleWarn.apply(console, arguments);
        };
      })();
    </script>
    <title>Lucid — The Academic Consciousness & Mastery Space</title>

    <script>
      (function() {
        try {
          var saved = localStorage.getItem('lucid_theme');
          var isDark = saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
      // Register PWA service worker for campus offline mode
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js').catch(function(err) {
            console.log('SW registration note:', err);
          });
        });
      }
    </script>
